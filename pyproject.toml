[project]
name = "agentsuite"
version = "0.1.0"
description = "Single-tenant multi-product agentic automation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agents = ["openai-agents>=0.0.14"]

[tool.setuptools.packages.find]
include = ["apps*"]
exclude = ["legacy_harvest*", "portable_core*", "data*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["portable_core/src", "."]
testpaths = ["portable_core/tests", "apps/api/tests"]
